# fly.toml app configuration file generated for ems-app on 2026-07-08T14:45:33+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ems-app'
primary_region = 'nrt'

[build]

# "app" runs the exact command the Dockerfile's own CMD already used —
# defining [processes] at all means every process group must be listed
# explicitly, so this keeps the web server's behavior unchanged.
# "reminders" runs Celery beat (core/tasks.py's beat_schedule) as a single
# always-on process — it ticks its own internal clock and fires each
# reminder sweep at its configured time, so unlike the old Fly-native
# `fly machine update --schedule=daily` approach, this machine is never
# expected to stop/start and can hold any number of independently-timed
# tasks. No Redis/worker needed: production runs Celery in eager mode
# (CELERY_TASK_ALWAYS_EAGER, see core/tasks.py), so beat executes each
# sweep inline in this same process when it comes due.
[processes]
  app = "uvicorn main:app --host 0.0.0.0 --port 8000"
  reminders = "celery -A core.tasks beat --loglevel=info"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
  processes = ["app"]

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
  processes = ["reminders"]
